# .github/workflows/code-review.yml
name: AI / Automated Code Review

on:
  pull_request:
    branches:
      - main

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Run backend linter
        run: |
          cd backend
          npx eslint . || true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: |
          cd frontend/myapp
          npm install
      - name: Run frontend linter
        run: |
          cd frontend/myapp
          npm run lint || true
